<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bài 6</title>
</head>
<body>
<script>
    let tong = 0;
    let count = 0;
    let i = 1;
    while (count < 30) {
        if (i % 7 === 0) {
            tong += i;
            count++;
        }
        i++;
    }
    document.write("Tổng của 30 số chia hết cho 7 đầu tiên là: " + tong);
</script>
</body>
</html>
