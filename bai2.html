<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<h2>Bài 2: Kiểm tra tuổi vào lớp 10</h2>
<input type="number" id="tuoi">
<button onclick="bai2()">Kiểm tra</button>
<p id="ketqua"></p>
<script>
    function bai2() {
        let tuoi = document.getElementById("tuoi").value;
        if (tuoi < 15) {
            document.write("Không đủ điều kiện vào lớp 10");
        } else {
            document.write( "Đủ điều kiện vào lớp 10");
        }
    }
</script>
</body>
</html>
