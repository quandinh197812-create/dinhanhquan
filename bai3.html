<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<h2>Bài 3: So sánh với 0</h2>
<input type="number" id="n">
<button onclick="bai3()">Kiểm tra</button>
<p id="ketqua"></p>

<script>
    function bai3() {
        let n =document.getElementById("n").value;
        if (n > 0) {
            document.write( "Số lớn hơn 0");
        } else if (n < 0) {
            document.write( "Số nhỏ hơn 0");
        } else {
            document.write("Số bằng 0");
        }
    }
</script>

</body>
</html>
