<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<h2>Bài 6: Giải phương trình bậc 1 (ax + b = 0)</h2>
<input type="number" id="a">
<input type="number" id="b">
<button onclick="dapAn()">Giải</button>
<p id="ketqua"></p>
<script>
    function dapAn() {
        let a = +document.getElementById("a").value;
        let b = +document.getElementById("b").value;
        if (a === 0 && b== 0) {
            document.write("Phương trình có vô số nghiệm");
        }
        else if (a=== 0 && b!== 0) {
            document.write("phương trình vô nghiệm");
        }
        else{
            let x=-b/a;
            document.write("nghiệm x:"+x);
        }
    }
</script>
</body>
</html>
