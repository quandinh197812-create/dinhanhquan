<h2>Bài 5: Diện tích tam giác vuông</h2>
<input type="number" id="nhapA" >
<input type="number" id="nhapB" >
<button onclick="tinh5()">Tính</button>
<p id="ketqua"></p>

        let a = +document.getElementById("nhapA").value;

        document.write("ket qua:" + c + "<br>")
    }
