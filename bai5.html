<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài 5: Xếp loại học lực</title>
</head>
<body>
<h2>Bài 5: Xếp loại học lực</h2>
<label>Kiểm tra:</label>
<input type="number" id="kt"><br><br>
<label>Giữa kỳ:</label>
<input type="number" id="gk"><br><br>
<label>Cuối kỳ:</label>
<input type="number" id="ck"><br><br>

<button onclick="bai5()">Xếp loại</button>

<p id="ketqua"></p>

<script>
    function bai5() {
        // Lấy giá trị từ input và chuyển sang số thực
        let kt = document.getElementById("kt").value;
        let gk = document.getElementById("gk").value;
        let ck = document.getElementById("ck").value;
        let dtb = (kt + gk * 2 + ck * 3) / 6;
        let kq;
        if (dtb >= 8) {
            kq = "Học lực Giỏi";
        } else if (dtb >= 6.5) {
            kq = "Học lực Khá";
        } else if (dtb >= 5) {
            kq = "Học lực Trung bình";
        } else {
            kq = "Học lực Yếu";
        }
        document.write("xếp loại:"+dtb+"kết quả"+kq+"<br>");
    }
</script>
</body>
</html>
