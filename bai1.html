<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ti</title>
</head>
<body>
<h2>Bài 1: Kiểm tra chia hết</h2>
<input type="number" id="a" >
<input type="number" id="b" >
<button onclick="bai1()">Kiểm tra</button>
<p id="kq1"></p>
<script>
    function bai1() {
        let a = document.getElementById("a").value;
        let b = document.getElementById("b").value;
        if (b !== 0) {
            if (a % b === 0) {
                document.write( "a chia hết cho b");
            } else {
                document.write( "a không chia hết cho b");
            }
        } else {
            document.write("Không thể chia cho 0");
        }
    }
</script>
</body>
</html>
