<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bai 1: Tinh diem</title>
</head>
<body>
<h1>Nhap diem cac monn</h1>
Vat li: <input type="number" id="vatly"><br>
Hoa hoc: <input type="number" id="hoahoc"><br>
Sinh hoc: <input type="number" id="sinhhoc"><br>
<button onclick="tinhdiem()">Tinh diem</button>
<p id="ketqua"></p>
<script>
    function tinhdiem() {
        let vatly = parseFloat(document.getElementById("vatly").value);
        let hoahoc = parseFloat(document.getElementById("hoahoc").value);
        let sinhhoc = parseFloat(document.getElementById("sinhhoc").value);
        let tong = vatly + hoahoc + sinhhoc;
        let trungbinh = tong / 3;
        document.write("tong diem: " + tong + "<br>");
        document.write("diem trung binh: " + trungbinh + "<br>");

    }
</script>
<h2>Chuyen doi C SANG F</h2>
<label for="celsius">Nhap do C: </label>
<input type="number" id="celsius">
<button onclick="chuyendoinhietdo()">Doi</button>
<p id="ketqua"></p>
<script>
    function chuyendoinhietdo() {
        let celsius = document.getElementById("celsius").value;
        let fahrenheit = (celsius * 9 / 5) + 32;
       document.write("Doi do F: " + fahrenheit + "<br>");
    }
</script>
</body>
</html>
