<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bai 1: Tinh diem</title>
</head>
<body>
<h1>Nhập điểm các môn </h1>
Vat li: <input type="number" id="vatLy"><br>
Hoa hoc: <input type="number" id="hoaHoc"><br>
Sinh hoc: <input type="number" id="sinhHoc"><br>
<button onclick="tinhdiem()">Tính điểm</button>
<p id="ket-qua"></p>
<script>
    function tinhdiem() {
        let vatLy = parseFloat(document.getElementById("vatLy").value);
        let hoaHoc = parseFloat(document.getElementById("hoaHoc").value);
        let sinhHoc = parseFloat(document.getElementById("sinhHoc").value);
        let tong = vatLy + hoaHoc + sinhHoc;
        let trungBinh = tong / 3;
        document.write("tong diem: " + tong + "<br>");
        document.write("diem trung binh: " + trungBinh + "<br>");

    }
</script>
<h2>Chuyển đổi C SANG F</h2>
<label for="celsius">Nhập độ C: </label>
<input type="number" id="celsius">
<button onclick="chuyendoinhietdo()">Đổi</button>
<p id="ket-qua"></p>
<script>
    function chuyendoinhietdo() {
        let celsius = document.getElementById("celsius").value;
        let fahrenheit = (celsius * 9 / 5) + 32;
       document.write("Đổi độ F: " + fahrenheit + "<br>");
    }
</script>

<title>Tính diện tích và chu vi hình tròn</title>
<h2>tính diện tích và chu vi  hình tròn</h2>
<label for="radius">Nhập bán kính R </label>
<input type="number" id="radius">
<button onclick="tinh()">Tính</button>
<p id="ket-qua"></p>
<script>
    function tinh() {
        let r = document.getElementById("radius").value;
        let dienTich = Math.PI * r * r;
        let chuVi = 2 * Math.PI * r;
        document.write("Diện tịch: " + dienTich + "<br>");
        document.write("chu vi: " + chuVi + "<br>");

    }
</script>
</body>
</html>
