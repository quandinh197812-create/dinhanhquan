<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bài 1</title>
    <h2>đếm số >=10</h2>
</head>
<body>
<script>
    let numbers = [5, 12, 8, 20, 3, 15, 7, 10, 25, 2];
    let count = 0;
    for (let i = 0; i < numbers.length; i++) {
        if (numbers[i] >= 10) {
            count++;
        }
    }
    console.log("Có " + count + " số nguyên >= 10");
</script>
</body>
</html>
