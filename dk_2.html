<!DOCTYPE html>
<html LANG="en">
<head>
    <meta charset="UTF-8">
    <title>Bài tập JavaScript</title>
</head>
<body>
<h2>Bài 1: Đổi °C sang °F</h2>
<input type="number" id="celsius">
<button onclick="tinh1()">Đổi</button>
<p id="ketqua"></p>
<script>
    function tinh1() {
        let c =document.getElementById("celsius").value;
        let f = c * 9 / 5 + 32;
        document.write("ket qua:" + f + "<br>")
    }
</script>
<h2>Bài 2: Đổi mét sang feet</h2>
<input type="number" id="met" >
<button onclick="doi()">Đổi</button>
<p id="ketqua"></p>
<script>
    function doi() {
        let m =document.getElementById("met").value;
        let ft = m * 3*2808;
        document.write("ket qua:" + ft + "<br>")
    }
</script>
<h2>Bài 4: Diện tích hình chữ nhật</h2>
<input type="number" id="nhapA" >
<input type="number" id="nhapB" >
<button onclick="tinh4()">Tính</button>
<p id="ketqua"></p>
<script>
    function tinh4() {
        let a = +document.getElementById("nhapA").value;
        let b = +document.getElementById("nhapB").value;
        let c = a * b;
        document.write("ket qua:" + c + "<br>")
    }
</script>
<h2>Bài 5: Diện tích tam giác vuông</h2>
<input type="number" id="nhapA" >
<input type="number" id="nhapB" >
<button onclick="tinh5()">Tính</button>
<p id="ketqua"></p>
<script>
function tinh5() {
let a = +document.getElementById("nhapA").value;
let b = +document.getElementById("nhapB").value;
let c = (a * b)/2;
document.write("ket qua:" + c + "<br>")
}
</script>
<h2>Bài 6: Giải phương trình bậc 1 (ax + b = 0)</h2>
<input type="number" id="a">
<input type="number" id="b">
<button onclick="dapAn()">Giải</button>
<p id="ketqua"></p>
<script>
    function dapAn() {
        let a = +document.getElementById("a").value;
        let b = +document.getElementById("b").value;
        if (a === 0 && b== 0) {
            document.write("Phương trình có vô số nghiệm");
        }
        else if (a=== 0 && b!== 0) {
            document.write("phương trình vô nghiệm");
        }
        else{
            let x=-b/a;
            document.write("nghiệm x:"+x);
        }
    }
</script>
<h2>Bài 7: Giải phương trình bậc 2 (ax² + bx + c = 0)</h2>
<input type="number" id="a2" >
<input type="number" id="b2" >
<input type="number" id="c2" >
<button onclick="phuongTrinh()">Giải</button>
<p id="ketqua"></p>
<script>
    function phuongTrinh() {
        let a = +document.getElementById("a2").value;
        let b = +document.getElementById("b2").value;
        let c =+document.getElementById("c2").value;
        let denta=b*b-a*c;
        if(a  == 0 ){
            document.write("đây là pt bâc 1");
        }
        else if(denta<0){
            document.write("pt vô nghiêm");
        }
        else if(denta == 0){
            let x=-b/2*a;
            document.write("pt có nghiệm x=");
        }
    }
</script>
</body>
</html>
