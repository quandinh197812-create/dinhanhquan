<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bài 4</title>
</head>
<body>
<script>
    let n1 = 0, n2 = 1, sotiepTheo;
    let found = false;
    while (!found) {
        sotiepTheo = n1 + n2;
        n1 = n2;
        n2 = sotiepTheo;
        if (n1 % 5 === 0) {
            document.write("Số đầu tiên trong dãy Fibonacci chia hết cho 5 là: " + n1);
            found = true;
        }
    }
</script>
</body>
</html>
