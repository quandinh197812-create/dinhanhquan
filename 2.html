<body>
<script>
    let nhietDo = parseFloat(prompt("Nhập vào nhiệt độ hiện tại:"));
    if (nhietDo > 100) {
        alert(" yêu cầu người dùng giảm nhiệt độ!");
    } else if (nhietDo < 20) {
        alert(" yu cầu người dùng tăng nhiệt độ!");
    }
</script>
</body>
