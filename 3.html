<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bài 3</title>
</head>
<body>
<script>
    let n1 = 0, n2 = 1, sotiepTheo;
    document.write("20 số Fibonacci đầu tiên:<br>");
    for (let i = 1; i <= 20; i++) {
        document.write(n1 + "<br>");
        sotiepTheo = n1 + n2;
        n1 = n2;
        n2 = sotiepTheo;
    }
</script>
</body>
</html>
